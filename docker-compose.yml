services:
  vault:
    build: .
    ports:
      - "3000:3000"              # App API — accessible on LAN and via Cloudflare tunnel
      - "3001:3001"              # Admin panel — LAN only (Cloudflare only tunnels 3000)
    volumes:
      - vault-data:/data
      - vault-storage:/storage
    restart: unless-stopped

volumes:
  vault-data:
  vault-storage:
