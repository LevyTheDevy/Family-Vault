services:
  vault:
    build: .
    ports:
      - "3000:3000"              # App API — accessible on LAN and via Cloudflare tunnel
      - "127.0.0.1:3001:3001"   # Admin panel — localhost only, never reachable remotely
    volumes:
      - vault-data:/data
      - vault-storage:/storage
    restart: unless-stopped

volumes:
  vault-data:
  vault-storage:
