services:
  vault:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
    volumes:
      - vault-data:/data
      - vault-storage:/storage
      - vault-backups:/backups
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    restart: unless-stopped
    depends_on:
      - vault
    profiles:
      - tunnel

volumes:
  vault-data:
  vault-storage:
  vault-backups:
