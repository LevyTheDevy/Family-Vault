name: Build APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Build APK
        working-directory: app
        run: eas build --platform android --profile preview --non-interactive

      - name: Download APK from EAS
        working-directory: app
        run: |
          URL=$(eas build:list --platform android --limit 1 --json --non-interactive | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); console.log(JSON.parse(d)[0].artifacts.buildUrl)")
          curl -L "$URL" -o FamilyVault-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/FamilyVault-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            ## Install

            **Android:** Download `FamilyVault-${{ github.ref_name }}.apk` and sideload it on your device.
            Enable *Install from unknown sources* in your Android settings first.

            **iOS:** See [building from source](#) in the README.
